[package]
name = "lizzieyzy-next-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "lizzieyzy_next_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
analysis-core = { path = "../../../crates/analysis-core" }
app-model = { path = "../../../crates/app-model" }
app-preferences = { path = "../../../crates/app-preferences" }
current-game-recovery = { path = "../../../crates/current-game-recovery" }
engine-manager = { path = "../../../crates/engine-manager" }
katago-protocol = { path = "../../../crates/katago-protocol" }
match-core = { path = "../../../crates/match-core" }
provider-fox = { path = "../../../crates/provider-fox" }
provider-yike = { path = "../../../crates/provider-yike" }
provider-tencent = { path = "../../../crates/provider-tencent" }
provider-core = { path = "../../../crates/provider-core" }
go-core = { path = "../../../crates/go-core" }
readboard-sidecar = { path = "../../../crates/readboard-sidecar" }
sgf = { path = "../../../crates/sgf" }
save-as-dialog = { path = "../../../crates/save-as-dialog" }
url = "2"
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-single-instance.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.61"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWindow", "NSButton", "NSView", "NSControl", "NSResponder"] }
